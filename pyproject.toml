[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stepgen"
version = "1.0.0"
description = "StepGen Designer v1 — microfluidic step-emulsification design tool"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
# Interactive Design Studio (Phase 4). Kept out of the lean core — install with:
#   pip install -e .[ui]
ui = ["streamlit"]

[tool.setuptools.packages.find]
include = ["stepgen*"]

[project.scripts]
stepgen = "stepgen.cli:main"
