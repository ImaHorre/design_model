[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stepgen"
version = "1.0.0"
description = "StepGen Designer v1 — microfluidic step-emulsification design tool"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
# Interactive Design Studio (Phase 4). Kept out of the lean core — install with:
#   pip install -e .[ui]
ui = ["streamlit"]
# Studio front door (`stepgen studio-serve`, plan C1) — install with:
#   pip install -e .[serve]
# Declared separately from [ui]: the server replaces Streamlit rather than
# extending it, and a fresh clone that only wants the front door should not
# pull Streamlit in.
serve = ["fastapi", "uvicorn"]

[tool.setuptools.packages.find]
include = ["stepgen*"]

[project.scripts]
stepgen = "stepgen.cli:main"
