# study_template.yaml — the ONE unified study config
# ─────────────────────────────────────────────────────────────────────────────
# Run with:   stepgen study configs/study_template.yaml
#
# Rules
#   * Any leaf may be a scalar (fixed) OR a list (swept). Swept axes form a
#     Cartesian product. `family:` is itself sweepable — a single device is
#     just "a sweep of one".
#   * Only the geometry sub-block of the SELECTED family is read per point.
#   * All geometry values are in µm / mm; SI conversion happens inside the model.
#
# This template reproduces the deep-20µm-DFU main-channel study on the current
# V5 serpentine family. Edit freely.
# ─────────────────────────────────────────────────────────────────────────────

title: "Deep-DFU serpentine main-channel study"
goal: flatness                       # 'flatness' or 'throughput' — sets sort + best-3

family: serpentine                   # scalar, or a list e.g. [serpentine] to compare styles

fluids:
  mu_dispersed:  0.06                # Pa·s — sunflower oil (dispersed, driven by Po)
  mu_continuous: 0.00089             # Pa·s — 2% SDS water (continuous)
  gamma:         0.015               # N/m  — effective interfacial tension (enables exit-Ca)
  emulsion_ratio: 0.10
  phase_system:  o/w

footprint:
  square_side_mm: 63.5               # die square for the fits-in-square gate

manufacturing:
  max_main_depth_um: 200.0           # current fab cap (depth)
  max_main_width_um: 1000.0          # current fab cap (width)
  min_wall_um: 5.0

operating:
  Po_mbar: 500.0                     # scalar or list, e.g. [200, 500]
  Qw_mlhr: 5.0                       # small carrier flow for the oil-side solve

# ── serpentine (current V5) geometry — the swept design space ────────────────
serpentine:
  main:
    depth_um: [200, 300, 400]        # 200 = fab cap; 300/400 relaxed by design
    width_um: [1000, 1500, 2000]     # 1000 = fab cap; 1500/2000 relaxed
  rung:
    length_mm: [1, 2, 4]             # DFU span (rung length)
    upstream_width_um: 15            # upstream DFU width (aspect floor)
    N: 1000                          # DFU count (Mcl derived as N × pitch)
  junction:
    exit_width_um: 60                # 60×20 µm deep exit
    exit_depth_um: 20
    pitch_um: 120
  # Alternatively, derive the junction from a droplet target instead of the
  # explicit junction block above:
  # target_droplet_um: [1, 10, 40]

# ── the decide layer — what "best" means for this study ──────────────────────
# Several value axes, not one goal. The output is a decision panel: a winner per
# axis, the Pareto set, an all-round pick and the safest pick. Per-axis winners
# and the Pareto set are the real finding — that the flattest design is a
# different device from the fastest one is exactly what you want to know.
#
# The composite is a convenience for ordering only. Its weights are declared
# here and recorded verbatim in the chapter: a composite whose weights are
# hidden is a worse tool than no composite at all.
#
# Axes: flatness | throughput | drive_pressure | area | droplet_um | margin
# `goal: <one word>` still works as a one-axis shorthand.
decide:
  axes: [flatness, throughput, drive_pressure, margin]
  weights: { flatness: 0.4, throughput: 0.3, drive_pressure: 0.2, margin: 0.1 }

# ── declarative scoring — traffic lights, worst-category-wins ────────────────
scoring:
  throughput_mlhr:   { green: 5,   orange: 1,   higher_better: true }
  uniformity_pct:    { green: 20,  orange: 100 }        # ΔP spread, lower = flatter
  operating_Po_mbar: { green: 100, orange: 500 }
  # SE→jetting ceiling: green ≤ 0.0125 (@montessori2020-step-emulsification),
  # orange ≤ 0.03 (@chakraborty2017-step-emulsification). Both at λ ≈ 1; we run
  # at λ ≈ 0.015, which narrows the SE window further.
  regime_Ca:         { green: 0.0125, orange: 0.03 }
  build:             { from: manufacturing, fits_square: required }

# ── optional click-in reference overlays (resolved + drawn on the plots) ──────
# kinds: modelled (solve a config), experimental (adapt+filter a lab CSV),
#        chapter (overlay another chapter's <chapter>.json rows).
# These are click-in only — never an automatic baseline compare.
reference:
  - { kind: modelled, config: configs/v5_30.yaml, label: "V5-30 (model)" }
  # - { kind: experimental, csv: ../experimental_workspaces/po_sweep/data/stage_timings.csv,
  #     filter: { DeviceID: V5-8-1, ContPhase: SDS }, label: "V5-8-1 (experiment)" }
